# Sem segredos aqui: credenciais e endereços vêm de variáveis de ambiente (ver .env.example).
spring:
  application:
    name: report-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seniorinsight}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # search_path da conexão: JPA, SQL nativo e Flyway enxergam só o schema do serviço.
      schema: report

  flyway:
    schemas: report
    default-schema: report

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 10

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

server:
  port: ${SERVER_PORT:8080}
  # O serviço fica atrás do API Gateway: respeita X-Forwarded-* (host, proto, prefix) nas URLs geradas.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

report:
  outbox:
    relay:
      intervalo: PT1S
      tamanho-lote: 100
      timeout-confirmacao: PT5S

  mensageria:
    # Eventos de si.events que caem na fila report.q (projeções de Scores e de SOS).
    routing-keys: score.#,sos.#

  armazenamento:
    # minio no ambiente local; em produção, Cloud Storage (adaptador da mesma porta).
    provedor: ${ARMAZENAMENTO_PROVEDOR:minio}
    bucket: ${ARMAZENAMENTO_BUCKET:si-reports}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      # Endereço usado nas URLs assinadas (o navegador do usuário precisa alcançá-lo).
      endpoint-publico: ${MINIO_PUBLIC_ENDPOINT:${report.armazenamento.minio.endpoint}}
      regiao: ${MINIO_REGION:us-east-1}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}

  agendamento:
    # Spring Scheduler local; desligue em produção (o gatilho é o Cloud Scheduler).
    habilitado: ${REPORT_AGENDAMENTO_HABILITADO:true}
    cron: "0 0 6 * * MON"
    zona: America/Sao_Paulo
